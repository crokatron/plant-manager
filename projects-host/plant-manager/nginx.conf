worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
    access_log off;
    error_log /dev/stderr warn;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $http_origin $origin_allowed {
        default 0;
        '' 1;
        'https://plants.mungoon.net' 1;
    }
    server {
        listen 8080;
        server_name plants.mungoon.net;
        client_max_body_size 20m;
        add_header Referrer-Policy same-origin always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        location = /_owner {
            internal;
            proxy_pass http://192.168.0.54:9070/api/admin/users;
            proxy_pass_request_body off;
            proxy_pass_request_headers off;
            proxy_set_header Content-Length '';
            proxy_set_header Host projects.mungoon.net;
            proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }
        location = /plant-map { return 302 /plant-map/; }
        location /P/ {
            auth_request /_owner;
            proxy_pass http://mungoon-plants-map:8080;
            proxy_set_header X-Mungoon-Email lamont.leras@gmail.com;
            proxy_set_header Cf-Access-Jwt-Assertion '';
            proxy_set_header Authorization '';
            proxy_set_header Host plants.mungoon.net;
        }
        location /plant-map/ {
            if ($origin_allowed = 0) { return 403; }
            auth_request /_owner;
            proxy_pass http://mungoon-plants-map:8080;
            proxy_set_header X-Mungoon-Email lamont.leras@gmail.com;
            proxy_set_header Cf-Access-Jwt-Assertion '';
            proxy_set_header Authorization '';
            proxy_set_header Host plants.mungoon.net;
            proxy_read_timeout 60s;
        }
        location / {
            if ($origin_allowed = 0) { return 403; }
            auth_request /_owner;
            proxy_pass http://mungoon-plants-web:80;
            proxy_set_header Host plants.mungoon.net;
            proxy_set_header X-Mungoon-Email lamont.leras@gmail.com;
            proxy_set_header X-Mungoon-Name Lamont;
            proxy_set_header Cf-Access-Jwt-Assertion '';
            proxy_set_header Authorization '';
            proxy_set_header Remote-User '';
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding '';
            sub_filter '</body>' '<script src="/plant-map/nav.js?v=20261009-3" defer></script></body>';
            sub_filter_once on;
            proxy_cookie_flags ~ secure httponly samesite=lax;
            proxy_connect_timeout 5s;
            proxy_read_timeout 90s;
        }
    }
}
